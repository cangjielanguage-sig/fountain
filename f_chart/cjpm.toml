[dependencies]
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_data" = {path = "../f_data"}
  "fountain::f_svg" = {path = "../f_svg"}

[package]
  cjc-version = "1.2.0"
  compile-option = "--dy-std -O2"
  override-compile-option = "--dy-std -O2"
  description = "JSON 驱动的 SVG 图表：统一 Chart 接口，一图一实现"
  link-option = ""
  name = "f_chart"
  organization = "fountain"
  output-type = "dynamic"
  src-dir = ""
  target-dir = ""
  version = "1.3.1019"
  package-configuration = {}
  category = ["Utility", "Data Visualization", "Developer Tools"]
  license = ["Apache-2.0"]
  include = ["src"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-TPC/fountain/tree/master/f_chart"

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl -O2"
  override-compile-option = "--dy-std -ldl -O2"
[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.aarch64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl -O2"
  override-compile-option = "--dy-std -ldl -O2"
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.x86_64-w64-mingw32]
  compile-option = "--dy-std -lcrypt32 -O2"
  override-compile-option = "--dy-std -lcrypt32 -O2"
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.x86_64-apple-darwin]
  compile-option = "--dy-std -O2"
  override-compile-option = "--dy-std -O2"
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.aarch64-apple-darwin]
  compile-option = "--dy-std -O2"
  override-compile-option = "--dy-std -O2"
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.aarch64-linux-ohos]
  compile-option = "--dy-std -ldl -O2"
  override-compile-option = "--dy-std -ldl -O2"
[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.x86_64-linux-ohos]
  compile-option = "--dy-std -ldl -O2"
  override-compile-option = "--dy-std -ldl -O2"
[target.x86_64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]

[profile.build]
  incremental = true
