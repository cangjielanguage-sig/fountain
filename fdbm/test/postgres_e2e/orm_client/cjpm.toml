[dependencies]
  "fountain::f_orm" = {path = "../../../../f_orm"}
  "fountain::f_dbd" = {path = "../../../../f_dbd"}
  "fountain::f_config" = {path = "../../../../f_config"}

[package]
  cjc-version = "1.3.0"
  name = "postgres_e2e_orm_client"
  description = "f_orm(fdbm 驱动, postgres 方言) ↔ fdbm ↔ PostgreSQL 联调客户端"
  output-type = "executable"
  version = "0.1.0"
  src-dir = "src"
  compile-option = "-Woff unused -Woff deprecated"

[target.aarch64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"

[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
