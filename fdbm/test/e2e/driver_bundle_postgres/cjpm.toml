# 仅用于把中心仓的 postgres_driver 构建成动态库（fdbm 的 driver/ 目录需要 .so）。
# 驱动自身的 cjpm.toml 声明 static，这里用依赖级 output-type 覆盖为 dynamic。
[dependencies]
  "postgres_driver" = {version = "0.1.0", output-type = "dynamic"}

[package]
  cjc-version = "1.3.0"
  name = "fdbm_pg_driver_bundle"
  description = "postgres_driver 动态库构建壳"
  output-type = "dynamic"
  version = "0.1.0"
  src-dir = "src"
  compile-option = "-Woff unused -Woff deprecated"

[target.aarch64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"

[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
