[dependencies]
  "fountain::f_app" = {path = "../f_app"}
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_codec" = {path = "../f_codec"}
  "fountain::f_concurrent" = {path = "../f_concurrent"}
  "fountain::f_config" = {path = "../f_config"}
  "fountain::f_data" = {path = "../f_data"}
  "fountain::f_dbd" = {path = "../f_dbd"}
  "fountain::f_dbm" = {path = "../f_dbm"}
  "fountain::f_dbpool" = {path = "../f_dbpool"}
  "fountain::f_log" = {path = "../f_log"}
  "fountain::f_net" = {path = "../f_net"}
  "fountain::f_protocol" = {path = "../f_protocol"}
  "fountain::f_store" = {path = "../f_store"}
  "fountain::f_util" = {path = "../f_util"}
  "fountain::f_version" = {path = "../f_version"}

[test-dependencies]
  "fountain::f_mockdb" = {path = "../f_mockdb"}

[package]
  cjc-version = "1.2.0"
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
  description = "数据库中间件，支持分库、读写分离与负载均衡"
  link-option = ""
  name = "fdbm"
  organization="fountain"
  output-type = "executable"
  src-dir = ""
  target-dir = ""
  version = "1.3.16"
  package-configuration = {}
  category = ["Database Framework", "Distributed", "Data Encapsulation and Transfer", "Network", "Infrastructure"]
  license = ["Apache-2.0"]
  include = ["src", "doc", "boot.sh"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-SIG/fountain/tree/master/fdbm"

[profile.build]
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std -ldl -O2"
  override-compile-option = "-O2 --lto=full --dy-std -ldl -O2"
[target.aarch64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std -ldl -O2"
  override-compile-option = "-O2 --lto=full --dy-std -ldl -O2"
[target.x86_64-w64-mingw32]
  compile-option = "-O2 --dy-std -lcrypt32"
  override-compile-option = "-O2 --dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
[target.aarch64-apple-darwin]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
[target.aarch64-linux-ohos]
  compile-option = "-O2 --dy-std -ldl"
  override-compile-option = "-O2 --dy-std -ldl"
[target.x86_64-linux-ohos]
  compile-option = "-O2 --dy-std -ldl"
  override-compile-option = "-O2 --dy-std -ldl"
