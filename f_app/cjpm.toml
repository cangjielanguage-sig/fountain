[package]
  cjc-version = "1.1.0"
  name = "f_app"
  organization="fountain"
  description = "依赖fountain开发的应用进程启动模块"
  version = "1.1.0"
  target-dir = ""
  src-dir = ""
  output-type = "dynamic"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}
  category = ["Utility"]
  license = ["Apache-2.0"]
  include = ["src"]
  authors = ["吴京润"]

[dependencies]
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_log" = {path = "../f_log"}
  "fountain::f_version" = {path = "../f_version"}

[profile.build]
  lto = "full"
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std -ldl"
  override-compile-option = "-O2 --lto=full --dy-std -ldl"
[target.aarch64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std -ldl"
  override-compile-option = "-O2 --lto=full --dy-std -ldl"
[target.x86_64-w64-mingw32]
  compile-option = "-O2 --dy-std -lcrypt32"
  override-compile-option = "-O2 --dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
[target.aarch64-apple-darwin]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
[target.aarch64-linux-ohos]
  compile-option = "-O2 --dy-std -ldl"
  override-compile-option = "-O2 --dy-std -ldl"
[target.x86_64-linux-ohos]
  compile-option = "-O2 --dy-std -ldl"
  override-compile-option = "-O2 --dy-std -ldl"