[dependencies]
  "fountain::f_aspect" = {path = "../f_aspect"}
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_bean" = {path = "../f_bean"}
  "fountain::f_data" = {path = "../f_data"}
  "fountain::f_jwt" = {path = "../f_jwt"}
  "fountain::f_log" = {path = "../f_log"}
  "fountain::f_mvc" = {path = "../f_mvc"}
  "fountain::f_orm" = {path = "../f_orm"}
  "fountain::f_security" = {path = "../f_security"}
  "fountain::f_ticktock" = {path = "../f_ticktock"}
  "fountain::f_version" = {path = "../f_version"}
  "fountain::f_util" = {path = "../f_util"}
#  pgsql = { git = "https://gitcode.com/aibrary/pgsql-driver.git", branch = "main", output-type = "dynamic"}
  "postgres_driver" = {version = "0.0.3", output-type="dynamic"} # 这个驱动支持从option传入用户名密码，orm配置为orm_option_username/orm_option_password/postgres_orm_option_username/postgres_orm_option_password

[workspace]
  version = "1.1.0"
  organization = "fountain"
  description = "demo for how to develop by fountain "
  members=["./boot", "./user"]
  compile-option = "-O2 --dy-std -Woff unused --debug-macro"
  override-compile-option = "-O2 --dy-std -Woff unused --debug-macro"

[profile.build]
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std -Woff unused"
  override-compile-option = "-O2 --lto=full --dy-std -Woff unused"
[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.aarch64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std -Woff unused"
  override-compile-option = "-O2 --lto=full --dy-std -Woff unused"
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.x86_64-w64-mingw32]
  compile-option = "-O2 --dy-std -Woff unused"
  override-compile-option = "-O2 --dy-std -Woff unused"
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.x86_64-apple-darwin]
  compile-option = "-O2 --dy-std -Woff unused"
  override-compile-option = "-O2 --dy-std -Woff unused"
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.aarch64-apple-darwin]
  compile-option = "-O2 --dy-std -Woff unused"
  override-compile-option = "-O2 --dy-std -Woff unused"
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.aarch64-linux-ohos]
  compile-option = "-O2 --dy-std -ldl"
  override-compile-option = "-O2 --dy-std -ldl"
[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]
[target.x86_64-linux-ohos]
  compile-option = "-O2 --dy-std -ldl"
  override-compile-option = "-O2 --dy-std -ldl"
[target.x86_64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]