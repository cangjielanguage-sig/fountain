[dependencies]
  f_data = {path = "../f_data"}
  f_time = {path = "../f_time"}
  f_exception = {path = "../f_exception"}
[package]
  cjc-version = "1.0.0"
  compile-option = "-O2"
  description = "nothing here"
  link-option = ""
  name = "f_jwt"
  output-type = "dynamic"
  override-compile-option = "-O2"
  src-dir = ""
  target-dir = ""
  version = "1.0.0"
  package-configuration = {}

[target]
[target.x86_64-w64-mingw32]
  compile-option = "-lcrypt32"
  [target.x86_64-w64-mingw32.bin-dependencies]
    path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]

[target.x86_64-unknown-linux-gnu]
  compile-option = "-ldl"
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_DYNAMIC_PATH}"]

[profile.build]
  lto = "full"
  incremental = true
