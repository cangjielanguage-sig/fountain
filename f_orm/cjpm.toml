[dependencies]
  charset4cj = { git = "https://gitcode.com/Cangjie-TPC/charset4cj.git", branch = "develop"} 
  f_aspect = {path = "../f_aspect"}
  f_base = {path = "../f_base"}
  f_bean = {path = "../f_bean"}
  f_collection = {path = "../f_collection"}
  f_config = {path = "../f_config"}
  f_data = {path = "../f_data"}
  f_exception = {path = "../f_exception"}
  f_log = {path = "../f_log"}
  f_macros = {path = "../f_macros"}
  f_regex = {path = "../f_regex"}
  f_pool = {path = "../f_pool"}
  f_util = {path = "../f_util"}

[package]
  cjc-version = "1.0.0"
  compile-option = "-O2"
  description = "nothing here"
  link-option = ""
  name = "f_orm"
  output-type = "dynamic"
  override-compile-option = "-O2"
  src-dir = ""
  target-dir = ""
  version = "1.0.0"
  package-configuration = {}

[profile.build]
  lto = "full"
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std"
  override-compile-option = "-O2 --lto=full --dy-std"
[target.aarch64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std"
  override-compile-option = "-O2 --lto=full --dy-std"
[target.x86_64-w64-mingw32]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
[target.x86_64-apple-darwin]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
[target.aarch64-apple-darwin]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"