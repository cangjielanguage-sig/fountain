[dependencies]
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_config" = {path = "../f_config"}
  "fountain::f_data" = {path = "../f_data"}
  "fountain::f_log" = {path = "../f_log"}
  "fountain::f_store" = {path = "../f_store"}

[package]
  cjc-version = "1.2.0"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  link-option = ""
  name = "f_hydra"
  organization = "fountain"
  description = "自实现向量存储（collection / record / 三路向量，无外部数据库）"
  output-type = "dynamic"
  src-dir = ""
  target-dir = ""
  version = "1.3.18"
  package-configuration = {}
  category = ["Utility", "Object Storage", "Developer Tools"]
  license = ["Apache-2.0"]
  include = ["src"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-TPC/fountain/tree/master/f_hydra"

[profile.build]
  incremental = true
