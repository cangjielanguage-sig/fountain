[dependencies]
  f_base  = {path = "../f_base", version = "1.0.44"}
  f_bean  = {path = "../f_bean", version = "1.0.44"}
  f_collection  = {path = "../f_collection", version = "1.0.44"}
  f_exception  = {path = "../f_exception", version = "1.0.44"}
  f_log  = {path = "../f_log", version = "1.0.44"}
  f_regex  = {path = "../f_regex", version = "1.0.44"}
  f_time  = {path = "../f_time", version = "1.0.44"}
  
[package]
  cjc-version = "1.0.4"
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
  description = "nothing here"
  link-option = ""
  name = "f_ticktock"
  output-type = "dynamic"
  src-dir = ""
  target-dir = ""
  version = "1.0.44"
  package-configuration = {}

[profile.build]
  lto = "full"
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std -ldl"
  override-compile-option = "-O2 --lto=full --dy-std -ldl"
[target.aarch64-unknown-linux-gnu]
  compile-option = "-O2 --lto=full --dy-std -ldl"
  override-compile-option = "-O2 --lto=full --dy-std -ldl"
[target.x86_64-w64-mingw32]
  compile-option = "-O2 --dy-std -lcrypt32"
  override-compile-option = "-O2 --dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"
[target.aarch64-apple-darwin]
  compile-option = "-O2 --dy-std"
  override-compile-option = "-O2 --dy-std"