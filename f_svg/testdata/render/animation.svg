<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <rect id="r" x="4" y="12" width="20" height="20" fill="#3366cc">
    <animate attributeName="x" from="4" to="40" dur="1s" fill="freeze"/>
    <animate attributeName="fill" from="#3366cc" to="#cc3333" dur="1s" fill="freeze"/>
  </rect>
  <circle id="c" cx="48" cy="44" r="10" fill="#33aa55">
    <animate attributeName="opacity" from="0.2" to="1" dur="1s" fill="freeze"/>
  </circle>
</svg>
