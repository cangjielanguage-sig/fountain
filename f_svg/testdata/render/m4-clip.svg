<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">
  <defs>
    <clipPath id="c"><rect x="10" y="10" width="30" height="30"/></clipPath>
    <marker id="m" markerWidth="4" markerHeight="4" refX="2" refY="2">
      <rect x="0" y="0" width="12" height="12" fill="#00aa00"/>
    </marker>
  </defs>
  <rect width="60" height="60" fill="#ffffff"/>
  <g transform="rotate(10 30 30)" clip="rect(5, 55, 55, 5)" clip-path="url(#c)">
    <rect width="60" height="60" fill="#ff0000"/>
  </g>
  <line x1="5" y1="50" x2="55" y2="50" stroke="#000000" stroke-width="4"
        vector-effect="non-scaling-stroke" stroke-dasharray="6 3"/>
  <line x1="5" y1="56" x2="55" y2="56" stroke="#000000" stroke-width="1"
        marker-start="url(#m)"/>
</svg>
