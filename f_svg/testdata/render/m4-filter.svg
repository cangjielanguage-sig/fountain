<svg xmlns="http://www.w3.org/2000/svg" width="80" height="48">
  <rect width="80" height="48" fill="#ffffff"/>
  <filter id="f">
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.1"/>
      <feFuncG type="gamma" amplitude="1" exponent="0.9"/>
    </feComponentTransfer>
    <feMorphology operator="dilate" radius="1"/>
    <feConvolveMatrix order="3" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0" divisor="1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.08 0.05" numOctaves="2" seed="7"
                  result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"
                       xChannelSelector="R" yChannelSelector="G"/>
    <feDiffuseLighting surfaceScale="2" diffuseConstant="0.9" lighting-color="#ffcc00">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
  </filter>
  <rect x="12" y="10" width="24" height="24" fill="#3366cc" filter="url(#f)"/>
  <rect x="44" y="10" width="24" height="24" fill="#cc6633" filter="url(#f)"/>
</svg>
