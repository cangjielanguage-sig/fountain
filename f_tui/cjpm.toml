[dependencies]
  "fountain::f_base" = {path = "../f_base"}
  "ratatui_core" = "0.1.2"
  "ratatui_style" = "0.1.2"
  "ratatui_text" = "0.1.2"
  "ratatui_layout" = "0.1.2"
  "ratatui_buffer" = "0.1.2"

[package]
  cjc-version = "1.2.0"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  description = "Unix 终端后端：raw mode、终端尺寸、按键解码、ANSI 渲染与 Buffer 渲染"
  link-option = ""
  name = "f_tui"
  organization = "fountain"
  output-type = "dynamic"
  src-dir = ""
  target-dir = ""
  version = "1.3.17"
  package-configuration = {}
  category = ["Terminal", "User Interface"]
  license = ["Apache-2.0"]
  include = ["src", "doc"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-TPC/fountain/tree/master/f_tui"

[profile.build]
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.aarch64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.x86_64-w64-mingw32]
  compile-option = "--dy-std -lcrypt32"
  override-compile-option = "--dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.x86_64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
