[package]
  cjc-version = "1.2.0"
  name = "fleet"
  organization = "fountain"
  description = "数据同步工具，可用于做配置中心"
  version = "1.3.13"
  target-dir = ""
  script-dir = ""
  output-type = "dynamic"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}
  category = ["Utility", "Developer Tools", "Distributed", "Infrastructure"]
  include = ["src"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-SIG/fountain/tree/master/fleet"
[dependencies]
  "fountain::f_app" = "1.3.3"
  "fountain::f_base" = "1.3.3"
  "fountain::f_codec" = "1.3.3"
  "fountain::f_collection" = "1.3.3"
  "fountain::f_config" = "1.3.3"
  "fountain::f_data" = "1.3.3"
  "fountain::f_io" = "1.3.3"
  "fountain::f_log" = "1.3.3"
  "fountain::f_net" = "1.3.3"
  "fountain::f_process" = "1.3.3"
  "fountain::f_protocol" = "1.3.3"
  "fountain::f_store" = "1.3.3"
  "fountain::f_util" = "1.3.3"
[profile.build]
  incremental = true
