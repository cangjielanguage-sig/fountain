[dependencies]
  "fountain::f_app" = "1.1.4"
  "fountain::f_config" = "1.1.4"
  "fountain::f_base" = "1.1.4"
  "fountain::f_codec" = "1.1.4"
  "fountain::f_net" = "1.1.4"
  "fountain::f_protocol" = "1.1.4"
  "fountain::f_store" = "1.1.4"
  "fountain::f_data" = "1.1.4"
  "fountain::f_exception" = "1.1.4"
  "fountain::f_log" = "1.1.4"
  "fountain::f_util" = "1.1.4"

[package]
  cjc-version = "1.1.0"
  description = "数据同步模块，可以用于配置、元数据注册等"
  link-option = ""
  name = "fleet"
  output-type = "dynamic"
  src-dir = ""
  target-dir = ""
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  organization = "fountain"
  version = "1.1.4"
  package-configuration = {}
  category = ["Utility"]
  license = ["Apache-2.0"]
  include = ["src", "doc"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]

[profile.build]
  lto = "full"
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "--lto=full --dy-std -ldl -O2"
  override-compile-option = "--lto=full --dy-std -ldl -O2"
[target.aarch64-unknown-linux-gnu]
  compile-option = "--lto=full --dy-std -ldl -O2"
  override-compile-option = "--lto=full --dy-std -ldl -O2"
[target.x86_64-w64-mingw32]
  compile-option = "--dy-std -lcrypt32"
  override-compile-option = "--dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.x86_64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
