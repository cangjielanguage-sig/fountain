[package]
  cjc-version = "1.2.0"
  name = "f_protocol"
  organization="fountain"
  description = "一个网络通讯协议实现"
  version = "1.3.10"
  target-dir = ""
  src-dir = ""
  output-type = "dynamic"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  link-option = ""
  package-configuration = {}
  category = ["Utility", "Data Encapsulation and Transfer", "Developer Tools"]
  license = ["Apache-2.0"]
  include = ["src"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-SIG/fountain/tree/master/f_protocol"

[dependencies]
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_codec" = {path = "../f_codec"}
  "fountain::f_config" = {path = "../f_config"}
  "fountain::f_data" = {path = "../f_data"}
  "fountain::f_exception" = {path = "../f_exception"}
  "fountain::f_pool" = {path = "../f_pool"}
  "fountain::f_util" = {path = "../f_util"}

[profile.build]
  incremental = true
