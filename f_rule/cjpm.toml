[package]
  cjc-version = "1.2.0"
  name = "f_rule"
  organization = "fountain"
  description = "规则引擎（事实库·Rete 网络·议程·决策流）"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  version = "1.3.1019"
  target-dir = ""
  script-dir = ""
  output-type = "dynamic"
  link-option = ""
  package-configuration = {}
  category = ["Utility", "Programming Framework", "Developer Tools"]
  license = ["Apache-2.0"]
  include = ["src"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target", "doc"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-TPC/fountain/tree/master/f_rule"

[dependencies]
  "fountain::f_app" = {path = "../f_app"}
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_collection" = {path = "../f_collection"}
  "fountain::f_concurrent" = {path = "../f_concurrent"}
  "fountain::f_egraph" = {path = "../f_egraph"}
  "fountain::f_excel" = {path = "../f_excel"}
  "fountain::f_jit" = {path = "../f_jit"}
  "fountain::f_log" = {path = "../f_log"}
  "fountain::f_regex" = {path = "../f_regex"}
  "fountain::f_ticktock" = {path = "../f_ticktock"}
  "fountain::f_util" = {path = "../f_util"}

[profile.build]
  incremental = true
