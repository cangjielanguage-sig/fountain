[dependencies]
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_config" = {path = "../f_config"}
  "fountain::f_data" = {path = "../f_data"}
  "fountain::f_health" = {path = "../f_health"}
  "fountain::f_httpclient" = {path = "../f_httpclient"}
  "fountain::f_net" = {path = "../f_net"}
  "fountain::f_probe" = {path = "../f_probe"}
  "fountain::f_protocol" = {path = "../f_protocol"}
  "fountain::f_rpc" = {path = "../f_rpc"}

[package]
  cjc-version = "1.2.0"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  description = "服务器监控节点代理与多节点监督端"
  link-option = ""
  name = "fprobe"
  organization = "fountain"
  output-type = "executable"
  src-dir = ""
  target-dir = ""
  version = "1.3.17"
  package-configuration = {}
  category = ["Data Monitoring", "Operations"]
  license = ["Apache-2.0"]
  include = ["src", "doc"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-TPC/fountain/tree/master/fprobe"

[profile.build]
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.aarch64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.x86_64-w64-mingw32]
  compile-option = "--dy-std -lcrypt32"
  override-compile-option = "--dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.x86_64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
