[dependencies]
  "fountain::f_config" = {path = "../f_config"}
  "fountain::f_data" = {path = "../f_data"}
  "fountain::f_hydra" = {path = "../f_hydra"}
  "fountain::f_jsonrpc" = {path = "../f_jsonrpc"}
  "fountain::f_log" = {path = "../f_log"}
  "fountain::f_mvc" = {path = "../f_mvc"}

[package]
  cjc-version = "1.2.0"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  link-option = ""
  name = "fhydra"
  organization = "fountain"
  description = "f_hydra 的 JSON-RPC 服务（f_jsonrpc + 自带 main）"
  output-type = "executable"
  src-dir = ""
  target-dir = ""
  version = "1.3.17"
  package-configuration = {}
  category = ["Utility", "Object Storage", "Developer Tools"]
  license = ["Apache-2.0"]
  include = ["src"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]
  repository = "https://gitcode.com/Cangjie-TPC/fountain/tree/master/fhydra"

[profile.build]
  incremental = true
