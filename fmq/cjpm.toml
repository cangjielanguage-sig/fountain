[dependencies]
  "fountain::f_base" = {path = "../f_base"}
  "fountain::f_codec" = {path = "../f_codec"}
  "fountain::f_config" = {path = "../f_config"}
  "fountain::f_data" = {path = "../f_data"}
  "fountain::f_io" = {path = "../f_io"}
  "fountain::f_net" = {path = "../f_net"}
  "fountain::f_protocol" = {path = "../f_protocol"}
  "fountain::f_store" = {path = "../f_store"}
  "fountain::f_util" = {path = "../f_util"}
  "fountain::fleet" = {path = "../fleet"}
  "fountain::f_log" = {path = "../f_log"}
  "fountain::f_app" = {path = "../f_app"}

[package]
  cjc-version = "1.2.0"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  description = "消息队列"
  link-option = ""
  name = "fmq"
  organization="fountain"
  output-type = "dynamic"
  src-dir = ""
  target-dir = ""
  version = "1.1.3"
  package-configuration = {}
  category = ["Utility"]
  license = ["Apache-2.0"]
  include = ["src", "doc"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]

[profile.build]
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "--lto=full --dy-std -ldl -O2"
  override-compile-option = "--lto=full --dy-std -ldl -O2"
[target.aarch64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl -O2"
  override-compile-option = "--dy-std -ldl -O2"
[target.x86_64-w64-mingw32]
  compile-option = "--dy-std -lcrypt32"
  override-compile-option = "--dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.x86_64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
