[package]
  cjc-version = "1.1.0"
  name = "f_egraph"
  organization = "fountain"
  description = "一个事件驱动的业务流程执行器"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  version = "1.1.0"
  target-dir = ""
  script-dir = ""
  output-type = "dynamic"
  link-option = ""
  package-configuration = {}

[dependencies]
  f_base = {path = "../f_base"}
  f_bean = {path = "../f_bean"}
  f_collection = {path = "../f_collection"}
  f_concurrent = {path = "../f_concurrent"}
  f_data = {path = "../f_data"}
  f_log = {path = "../f_log"}

[profile.build]
  incremental = true