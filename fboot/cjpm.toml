[dependencies]
  "fountain::f_app" = {path = "../f_app"}

[package]
  cjc-version = "1.2.0"
  description = "依赖fountain的应用项目启动程序"
  link-option = ""
  name = "fboot"
  output-type = "executable"
  src-dir = ""
  target-dir = ""
  # compile-option = "--static --static-std"

  compile-option = "--dy-std"
  override-compile-option = "--dy-std"

  organization = "fountain"
  version = "1.3.0"
  package-configuration = {}
  category = ["Utility"]
  license = ["Apache-2.0"]
  include = ["src", "doc"]
  exclude = ["cjpm.toml.bak", "cjpm.lock", "target"]
  authors = ["吴京润"]

[profile.build]
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "--lto=full --dy-std -ldl -O2"
  override-compile-option = "--lto=full --dy-std -ldl -O2"
  
  # compile-option = "--lto=full -ldl -O2"
  # override-compile-option = "--lto=full -ldl -O2"
[target.aarch64-unknown-linux-gnu]
  compile-option = "--lto=full --dy-std -ldl -O2"
  override-compile-option = "--lto=full --dy-std -ldl -O2"
[target.x86_64-w64-mingw32]
  compile-option = "--dy-std -lcrypt32"
  override-compile-option = "--dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-apple-darwin]
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
[target.aarch64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.x86_64-linux-ohos]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"

