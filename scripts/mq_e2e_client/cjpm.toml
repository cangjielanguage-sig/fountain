[dependencies]
  "fountain::f_base" = {path = "../../f_base"}
  "fountain::f_codec" = {path = "../../f_codec"}
  "fountain::f_config" = {path = "../../f_config"}
  "fountain::f_data" = {path = "../../f_data"}
  "fountain::f_io" = {path = "../../f_io"}
  "fountain::f_log" = {path = "../../f_log"}
  "fountain::f_mq" = {path = "../../f_mq"}
  "fountain::f_net" = {path = "../../f_net"}
  "fountain::f_protocol" = {path = "../../f_protocol"}
  "fountain::f_time" = {path = "../../f_time"}
  "fountain::f_util" = {path = "../../f_util"}

[package]
  cjc-version = "1.2.0"
  compile-option = "--dy-std"
  override-compile-option = "--dy-std"
  description = "fmq 端到端脚本用的最小客户端"
  name = "mq_e2e_client"
  organization = "fountain"
  output-type = "executable"
  version = "1.3.17"
  license = ["Apache-2.0"]
  exclude = ["target", "cjpm.lock"]

[target.x86_64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"
[target.aarch64-unknown-linux-gnu]
  compile-option = "--dy-std -ldl"
  override-compile-option = "--dy-std -ldl"

[profile.build]
  incremental = true
